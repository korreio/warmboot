[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warmboot-label-normalizer-example"
version = "0.1.0"
description = "Synthetic standard-library label comparison-key example"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
label-normalize = "label_normalizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
