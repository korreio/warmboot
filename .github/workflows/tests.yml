# Runs the style check on Ubuntu, and the toolkit suites, the diagram check, both example suites, the guided CLI and BOOTSTRAP's install exercise on Ubuntu and macOS.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Lint and format check (pinned ruff)
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.1
          ruff check --no-cache .
          ruff format --check --no-cache .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Toolkit suite
        run: python -m unittest discover -s tests -v

      - name: Diagram wrappers match their sources
        run: python -B tools/render_mermaid_docs.py --root . --check

      - name: Cold example suite
        working-directory: examples/python-cold
        run: python -m unittest discover -s tests -v

      - name: Guided example suite
        working-directory: examples/python-guided
        run: python -m unittest discover -s tests -v

      - name: Guided CLI prints its documented output
        working-directory: examples/python-guided
        shell: bash
        run: |
          PYTHONPATH=src python -m label_normalizer "  Warm   BOOT  " "Straße" > "$RUNNER_TEMP/guided-cli.txt"
          printf 'warm boot\nstrasse\n' | diff -u - "$RUNNER_TEMP/guided-cli.txt"

      # Runs every sh block of BOOTSTRAP's disposable example in order, as documented.
      - name: BOOTSTRAP install exercise
        shell: bash
        run: |
          python - "$RUNNER_TEMP/bootstrap-exercise.sh" <<'PY'
          import pathlib, sys
          heading = "## Disposable install and resume example"
          lines = pathlib.Path("BOOTSTRAP.md").read_text(encoding="utf-8").splitlines()
          start = lines.index(heading)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          script, block, count = ["set -euo pipefail"], None, 0
          for line in lines[start + 1:end]:
              if block is None and line == "```sh":
                  block = []
              elif block is not None and line == "```":
                  script.extend(block)
                  block, count = None, count + 1
              elif block is not None:
                  block.append(line)
          if block is not None or count == 0:
              sys.exit(f"{heading}: no complete sh blocks found")
          pathlib.Path(sys.argv[1]).write_text("\n".join(script) + "\n", encoding="utf-8")
          print(f"extracted {count} sh blocks")
          PY
          bash "$RUNNER_TEMP/bootstrap-exercise.sh"
